<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50">
  <!-- Saudi Tabreed Logo Recreation -->
  <!-- ST Letters Mark -->
  <g transform="translate(0, 3)">
    <!-- S letter - dark blue -->
    <path d="M0,30 C0,30 0,20 8,14 C16,8 20,12 20,18 C20,24 12,26 8,30 C4,34 0,36 0,42 L20,42"
          fill="none" stroke="#1B3A6B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- T letter top bar -->
    <line x1="22" y1="5" x2="42" y2="5" stroke="#1B3A6B" stroke-width="5" stroke-linecap="round"/>
    <!-- T letter vertical -->
    <line x1="32" y1="5" x2="32" y2="42" stroke="#1B3A6B" stroke-width="5" stroke-linecap="round"/>
    <!-- Accent mark - teal/turquoise -->
    <rect x="36" y="0" width="8" height="8" rx="1" fill="#2EC4B6"/>
  </g>
  <!-- Saudi Tabreed text - English -->
  <text x="55" y="22" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A6B" letter-spacing="-0.5">saudi tabreed</text>
  <!-- Arabic text -->
  <text x="55" y="42" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#1B3A6B" letter-spacing="0.5">تبريد السعودية</text>
</svg>
